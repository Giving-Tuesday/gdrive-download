[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gdrive-download"
version = "0.1.0"
authors = [
    {name = "GivingTuesday", email = "tech@givingtuesday.org"},
]
description = "Tools for downloading and converting documents from Google Drive to markdown"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "google-api-python-client>=2.108.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth-httplib2>=0.1.1",
    "markdownify>=0.11.6",
    "mammoth>=1.9.1",
    "python-docx>=1.2.0",
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "pathspec>=0.11.0",
    "PyQt5>=5.15.0",
    "markdown-it-py>=3.0.0",
    "mdit-py-plugins>=0.4.0",
    "pypandoc>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "sphinx-click>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/givingtuesday/gdrive-download"
"Bug Reports" = "https://github.com/givingtuesday/gdrive-download/issues"
"Source" = "https://github.com/givingtuesday/gdrive-download"

[project.scripts]
gdrive-download = "gdrive_download.cli.download:main"
gdrive-manage = "gdrive_download.cli.manage:main"
gdrive-search = "gdrive_download.cli.search:search"
gdrive-upload = "gdrive_download.cli.upload:upload"
gdrive-write-tab = "gdrive_download.cli.upload:write_to_doc"

[project.gui-scripts]
gdrive-gui = "gdrive_download.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src/gdrive_download --cov=src/document_analyzer --cov-report=html --cov-report=term"