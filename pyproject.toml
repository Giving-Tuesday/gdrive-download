[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "givingtuesday-aar-tools"
version = "1.0.0"
authors = [
    {name = "GivingTuesday", email = "tech@givingtuesday.org"},
]
description = "Tools for downloading and analyzing After Action Review documents from Google Drive"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "google-api-python-client>=2.108.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth-httplib2>=0.1.1",
    "markdownify>=0.11.6",
    "mammoth>=1.9.1",
    "python-docx>=1.2.0",
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "pathspec>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "sphinx-click>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/givingtuesday/aar-tools"
"Bug Reports" = "https://github.com/givingtuesday/aar-tools/issues"
"Source" = "https://github.com/givingtuesday/aar-tools"

[project.scripts]
aar-download = "givingtuesday_aar.cli.download:main"
aar-analyze = "givingtuesday_aar.cli.analyze:main"
aar-extract-data = "givingtuesday_aar.cli.extract_data:main"
aar-manage = "givingtuesday_aar.cli.manage:main"
aar-search = "givingtuesday_aar.cli.search:search"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src/givingtuesday_aar --cov-report=html --cov-report=term"