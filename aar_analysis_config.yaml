name: "After Action Review Analysis"
description: "Analysis framework for GivingTuesday After Action Review documents using actual template structure"

categories:
  successes:
    description: "Positive outcomes, achievements, and effective practices that contributed to success"
    section_headers:
      # Primary headings (most common)
      - "successes"
      - "what went well"
      # Variations found in documents
      - "successes (10 mins)"
      - "successes (the great!)"
      - "successes (the good)"
      - "what actually happened?"
    patterns:
      leadership: "(?i)(leader|development|empowerment|capacity|growth|mentorship|coaching|guidance|direction)"
      content: "(?i)(content|engagement|quality|storytelling|media|creative|messaging|narrative|brand|marketing)"
      agility: "(?i)(agility|opportunity|adaptive|innovation|strategic|flexible|responsive|quick|pivot|adapt)"
      data_excellence: "(?i)(measurement|research|data|analysis|insight|evidence|metrics|tracking|reporting|dashboard)"
      partnerships: "(?i)(partnership|collaboration|relationship|network|alliance|cooperation|teamwork|coordination)"
      community: "(?i)(community|engagement|mobilization|participation|volunteer|grassroots|local|regional|involvement)"
      impact: "(?i)(impact|outcome|result|effect|benefit|value|difference|change|improvement|success)"

  improvements:
    description: "Areas for improvement, challenges encountered, and lessons learned from difficulties"
    section_headers:
      # Primary headings (most common)
      - "improvements"
      - "what didn't go well"
      # Variations found in documents
      - "improvements (the not-great)"
      - "what were you expecting the day-of to look like?"
    patterns:
      resource_constraints: "(?i)(resource|staff|capacity|time|budget|money|funding|personnel|understaffed|overworked|limited.*resources)"
      data_collection: "(?i)(data|metric|measurement|tracking|report|survey|analytics|reporting|collection|dashboard|kpi)"
      communication: "(?i)(communication|coordination|messaging|coverage|press|media|outreach|visibility|awareness|promotion)"
      partnership: "(?i)(partner|collaboration|relationship|stakeholder|vendor|supplier|external|coordination|alignment)"
      timing_scope: "(?i)(timeline|scope|planning|expectation|deadline|schedule|timing|rushed|delayed|late|early)"
      technical_issues: "(?i)(technical|system|platform|website|tool|software|integration|bug|error|crash|outage)"
      process_workflow: "(?i)(process|workflow|procedure|protocol|documentation|training|onboarding|handoff)"

  learnings:
    description: "Key insights, patterns, and strategic learnings extracted from the experience"
    section_headers:
      # Primary headings (most common)
      - "learnings/insights"
      - "learning/insights"
      # Variations found in documents
      - "learnings/insights (the unexpected)"
      - "learning/way forward"
      - "expectations"
      - "what did you expect?"
      - "reality"
    patterns:
      strategic_insights: "(?i)(strategy|strategic|approach|methodology|framework|model|best.*practice)"
      organizational_learning: "(?i)(learn|lesson|insight|understanding|knowledge|experience|wisdom|realize)"
      future_planning: "(?i)(future|next.*time|going.*forward|plan|prepare|anticipate|expect)"
      pattern_recognition: "(?i)(pattern|trend|recurring|consistent|theme|common|frequent|typical)"
      capacity_building: "(?i)(capacity|skill|competency|capability|training|development|growth|expertise)"

  action_plan:
    description: "Concrete next steps, recommendations, and planned actions for future improvement"
    section_headers:
      # Primary headings (most common)
      - "action plan"
      - "next steps"
      # Variations found in documents
      - "action plan (the recommendations/to do)"
      - "action plan/next steps"
      - "next steps/action plan"
      - "action items"
    patterns:
      concrete_actions: "(?i)(will|should|must|need.*to|plan.*to|action|implement|execute|deliver|complete)"
      ownership_assignment: "(?i)(who|responsible|owner|assign|delegate|accountable|lead|champion)"
      timeline_planning: "(?i)(when|by.*date|deadline|timeline|schedule|timeframe|target.*date)"
      resource_allocation: "(?i)(budget|resource|staff|hire|procure|invest|allocate|fund)"
      measurement_tracking: "(?i)(measure|track|monitor|evaluate|assess|review|report|kpi|metric)"

  background:
    description: "Context, background information, and factual details about the activity or event"
    section_headers:
      # Primary headings (most common)
      - "background & links"
      - "background"
      # Variations found in documents
      - "background (the facts)"
      - "agenda"
      - "meeting notes"
      - "notes from discussion"
    patterns:
      context_setting: "(?i)(context|background|overview|summary|about|regarding|concerning)"
      factual_details: "(?i)(fact|data|number|statistic|figure|amount|count|total|participant)"
      event_details: "(?i)(event|activity|campaign|initiative|project|program|workshop|meeting)"
      scope_scale: "(?i)(scope|scale|size|magnitude|reach|coverage|participation|attendance)"

extraction:
  max_quotes_per_category: 5
  context_chars: 150
  recurring_theme_threshold: 3