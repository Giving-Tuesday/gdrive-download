name: Build Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - gui-app
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: "GDrive Tools.app"
            asset_name: GDrive-Tools-macOS.zip
          - os: windows-latest
            artifact_name: "GDrive Tools.exe"
            asset_name: GDrive-Tools-Windows.exe
          - os: ubuntu-latest
            artifact_name: "GDrive Tools"
            asset_name: GDrive-Tools-Linux

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller packaging/gdrive-gui.spec --clean --distpath dist/
        timeout-minutes: 10

      - name: Zip macOS app
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -r "${{ matrix.asset_name }}" "GDrive Tools.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/${{ matrix.artifact_name }}
            dist/${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
